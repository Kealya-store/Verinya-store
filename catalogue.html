<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue | Verinya Store</title>
<link rel="stylesheet" href="assets/css/style.css">

</head>
<body>

<header class="site-header">

    <div class="container">

        <a href="index.html" class="logo">VERINYA STORE</a>

        <nav class="navbar">
            <a href="index.html">Accueil</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="devis.html">Devis</a>
            <a href="contact.html">Contact</a>
        </nav>

    </div>

</header>

<section class="catalog-hero">

    <div class="container">

        <h1>Notre Catalogue</h1>

        <p>
            Découvrez tous nos vêtements professionnels,
            personnalisables ou non.
        </p>

    </div>

</section>

<section class="catalog-filters">

    <div class="container">

        <button class="filter active" data-filter="all">Tous</button>
        <button class="filter" data-filter="tshirts">T-Shirts</button>
        <button class="filter" data-filter="polos">Polos</button>
        <button class="filter" data-filter="tricots">Tricots</button>
        <button class="filter" data-filter="hoodies">Hoodies</button>
        <button class="filter" data-filter="cuisine">Cuisine</button>
        <button class="filter" data-filter="travail">Travail</button>
        <button class="filter" data-filter="sport">Sport</button>

    </div>

</section>

<section class="catalog-products">

    <div class="container">

        <div class="catalog-grid" id="catalog-grid">
        </div>

    </div>

</section>

<footer class="site-footer">
    <div class="logo">Verinya</div>
    <p>Livraison dans toute l'Algérie · Paiement à la livraison</p>
    <p class="footer-contact">WhatsApp : [ton numéro]</p>
</footer>

<script src="assets/js/products.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/script.js"></script>

<script>
    renderProducts("catalog-grid");
</script>

</body>
</html>
