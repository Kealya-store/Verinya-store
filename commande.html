<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Verinya Store - Vêtements professionnels personnalisables en Algérie. Livraison rapide, paiement à la livraison.">
  <title>Finaliser ma commande | Verinya Store</title>
<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<header class="site-header">

    <div class="container">

        <a href="index.html" class="logo">VERINYA STORE</a>

        <nav class="navbar">
            <a href="index.html">Accueil</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="devis.html">Devis</a>
            <a href="contact.html">Contact</a>
        </nav>

    </div>

</header>

<section class="section">

    <div class="offer-card">

        <h2>Finaliser ma commande</h2>

        <div id="recap"></div>

        <form class="order-form" id="commande-form">

            <label for="nom">Nom complet</label>
            <input type="text" id="nom" required>

            <label for="telephone">Numéro de téléphone</label>
            <input type="tel" id="telephone" placeholder="05XX XX XX XX" required>

            <label for="ville">Wilaya / Ville</label>
            <input type="text" id="ville" required>

            <label for="adresse">Adresse de livraison</label>
            <input type="text" id="adresse" required>

            <label for="note">Note (optionnel)</label>
            <textarea id="note" placeholder="Précision supplémentaire..."></textarea>

            <button type="submit" class="btn btn-primary btn-block">
                Envoyer la commande sur WhatsApp
            </button>

        </form>

        <p style="font-size:0.85rem; margin-top:16px; text-align:center;">
            Paiement à la livraison. Ta commande sera confirmée directement par WhatsApp.
        </p>

    </div>

</section>

<footer class="site-footer">
    <div class="logo">Verinya</div>
    <p>Livraison dans toute l'Algérie · Paiement à la livraison</p>
    <p class="footer-contact">WhatsApp : <a href="https://wa.me/213XXXXXXXXX" style="color:var(--ivory);text-decoration:underline;">213 XX XX XX XX</a></p>
</footer>

<script src="assets/js/products.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/commande.js"></script>

  <script src="assets/js/menu.js"></script>
</body>
</html>
