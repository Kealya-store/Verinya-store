<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Verinya Store - Vêtements professionnels personnalisables en Algérie. Livraison rapide, paiement à la livraison.">
  <title>Contact | Verinya Store</title>
<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<header class="site-header">

    <div class="container">

        <a href="index.html" class="logo">VERINYA STORE</a>

        <nav class="navbar">
            <a href="index.html">Accueil</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="devis.html">Devis</a>
            <a href="contact.html">Contact</a>
        </nav>

    </div>

</header>

<section class="catalog-hero">

    <div class="container">

        <h1>Nous contacter</h1>

        <p>
            Une question sur un produit, une livraison ou une commande ?
            Écris-nous, on te répond rapidement sur WhatsApp.
        </p>

    </div>

</section>

<section class="section">

    <div class="offer-card">

        <h2>Envoyer un message</h2>

        <form class="order-form" id="contact-form">

            <label for="nom">Nom complet</label>
            <input type="text" id="nom" required>

            <label for="telephone">Numéro de téléphone</label>
            <input type="tel" id="telephone" placeholder="05XX XX XX XX" required>

            <label for="message">Ton message</label>
            <textarea id="message" placeholder="Écris ta question ici..." required></textarea>

            <button type="submit" class="btn btn-primary btn-block">
                Envoyer sur WhatsApp
            </button>

        </form>

    </div>

</section>

<footer class="site-footer">
    <div class="logo">Verinya</div>
    <p>Livraison dans toute l'Algérie · Paiement à la livraison</p>
    <p class="footer-contact">WhatsApp : chargement...</p>
</footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/contact.js"></script>

  <script src="assets/js/footer.js"></script>
<script src="assets/js/menu.js"></script>
</body>
</html>
