<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produit | Verinya Store</title>
<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<header class="site-header">

    <div class="container">

        <a href="index.html" class="logo">VERINYA STORE</a>

        <nav class="navbar">
            <a href="index.html">Accueil</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="devis.html">Devis</a>
            <a href="contact.html">Contact</a>
        </nav>

    </div>

</header>

<section class="product-page">

    <div class="container product-layout">

        <div class="product-gallery">
            <img id="main-image" src="assets/img/tshirt.jpg" alt="Produit">
        </div>

        <div class="product-info">

            <h1 id="product-title">Chargement...</h1>

            <p id="product-description"></p>

            <h2 class="price" id="product-price"></h2>

            <label for="couleur">Couleur</label>
            <select id="couleur"></select>

            <label for="taille">Taille</label>
            <select id="taille"></select>

            <h3>Choisissez votre version</h3>

            <label>
                <input type="radio" name="version" value="origine" checked>
                Produit d'origine
            </label>

            <br><br>

            <label>
                <input type="radio" name="version" value="personnalise">
                Produit personnalisé
            </label>

            <div id="custom-options">

                <hr>

                <h3>Personnalisation</h3>

                <label for="technique">Technique</label>
                <select id="technique">
                    <option>Broderie</option>
                    <option>DTF</option>
                    <option>Sérigraphie</option>
                    <option>Flocage</option>
                </select>

                <label for="position">Position</label>
                <select id="position">
                    <option>Poitrine</option>
                    <option>Dos</option>
                    <option>Manche</option>
                    <option>Devant complet</option>
                </select>

                <label for="texte-perso">Texte à ajouter (optionnel)</label>
                <input type="text" id="texte-perso" placeholder="Votre texte">

                <label for="logo-description">Décris ton logo (tu pourras l'envoyer en photo dans WhatsApp)</label>
                <textarea id="logo-description" placeholder="Ex: logo rond bleu et blanc avec le nom de l'entreprise"></textarea>

            </div>

            <label for="quantite">Quantité</label>
            <input type="number" id="quantite" value="1" min="1">

            <button id="buy-btn" class="btn-product whatsapp-btn" style="border:none; width:100%; cursor:pointer;">
                Acheter
            </button>

        </div>

    </div>

</section>

<footer class="site-footer">
    <div class="logo">Verinya</div>
    <p>Livraison dans toute l'Algérie · Paiement à la livraison</p>
    <p class="footer-contact">WhatsApp : [ton numéro]</p>
</footer>

<script src="assets/js/products.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/produit.js"></script>

</body>
</html>
