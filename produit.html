<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produit | Verinya Store</title>

<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<header class="site-header">

<div class="container">

<a href="index.html" class="logo">

VERINYA STORE

</a>

<nav class="navbar">

<a href="index.html">Accueil</a>

<a href="catalogue.html">Catalogue</a>

<a href="#">Contact</a>

</nav>

</div>

</header>

<section class="product-page">

<div class="container product-layout">

<div class="product-gallery">

<img
id="main-image"
src="assets/img/tshirt.jpg"
alt="Produit">

</div>

<div class="product-info">

<h1 id="product-title">

T-Shirt Classique

</h1>

<p id="product-description">

Produit disponible en version d'origine ou personnalisée.

</p>

<h2 class="price">

À partir de 0 DA

</h2>

<h3>Choisissez votre version</h3>

<label>

<input
type="radio"
name="version"
value="origine"
checked>

Produit d'origine

</label>

<br><br>

<label>

<input
type="radio"
name="version"
value="personnalise">

Produit personnalisé

</label>

<div id="custom-options">

<hr>

<h3>Personnalisation</h3>

<label>

Technique

</label>

<select>

<option>Broderie</option>

<option>DTF</option>

<option>Sérigraphie</option>

<option>Flocage</option>

</select>

<label>

Position

</label>

<select>

<option>Poitrine</option>

<option>Dos</option>

<option>Manche</option>

<option>Devant complet</option>

</select>

<label>

Texte à ajouter

</label>

<input
type="text"
placeholder="Votre texte">

<label>

Description du logo

</label>

<textarea
placeholder="Décrivez votre logo"></textarea>

<label>

Quantité

</label>

<input
type="number"
value="1"
min="1">

</div>

<a
href="#"
class="btn-product whatsapp-btn">

Commander sur WhatsApp

</a>

</div>

</div>

</section>

<script src="assets/js/script.js"></script>

</body>

</html>
